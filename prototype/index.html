var resolvedAlerts = {};
var statusHistory = [];
var shSeq = 0;

/* ============================= STATE ============================= */
var state = { view:'dashboard', currentUserId:'u1', search:'', custFilter:'all', fuTab:'today', fuScope:'mine', drawerCustId:null };
function role(){ return userOf(state.currentUserId).role; }

/* ============================= HELPERS ============================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmtDate(d){ return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(d){ return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function money(n){ return '$'+Number(n).toLocaleString('en-US'); }
function relTime(d){
  var diff = Math.round((now-d)/(1000*60*60*24));
  if(diff<=0) return 'today'; if(diff===1) return 'yesterday';
  if(diff<7) return diff+'d ago'; if(diff<31) return Math.round(diff/7)+'w ago';
  return Math.round(diff/30)+'mo ago';
}
function dueLabel(d, done){
  var diff = Math.round((d-now)/(1000*60*60*24));
  if(done) return 'Completed '+fmtDate(d);
  if(diff<0) return 'Overdue by '+Math.abs(diff)+'d';
  if(diff===0) return 'Due today';
  if(diff===1) return 'Due tomorrow';
  return 'Due '+fmtDate(d);
}
function showToast(msg){
  var t=document.getElementById('toast'); t.textContent=msg;
  t.style.opacity='1'; t.style.transform='translate(-50%,0)';
  clearTimeout(showToast._t);
  showToast._t=setTimeout(function(){ t.style.opacity='0'; t.style.transform='translate(-50%,10px)'; },2300);
}

  document.getElementById('bellPop').classList.remove('open');

function visibleCustomers(){
  return customers.filter(function(c){
    if(role()==='admin') return true;
    if(role()==='manager') return c.team===userOf(state.currentUserId).team;
    return c.ownerId===state.currentUserId;
  });
}
function custActivities(id){ return activities.filter(function(a){return a.customerId===id;}).sort(function(a,b){return b.occurredAt-a.occurredAt;}); }
function custFollowUps(id){ return followUps.filter(function(f){return f.customerId===id;}).sort(function(a,b){return a.dueAt-b.dueAt;}); }
function custStatusHistory(id){ return statusHistory.filter(function(h){return h.customerId===id;}).sort(function(a,b){return b.changedAt-a.changedAt;}); }
function nextFollowUp(id){ var list = custFollowUps(id).filter(function(f){return f.status!=='done';}); return list.length? list[0] : null; }
function toLocalInputValue(d){ function pad(n){return String(n).length<2?'0'+n:''+n;} return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function visibleFollowUps(){
  var vis = visibleCustomers();
  return followUps.filter(function(f){ return vis.some(function(c){return c.id===f.customerId;}); });

function computeAlerts(){
  var list = [];
  followUps.forEach(function(f){
    if(f.status==='done') return;
    if(f.dueAt < now){
      var c = customers.find(function(x){return x.id===f.customerId;});
      if(!c) return;
      list.push({id:'ov-'+f.id, kind:'overdue', customerId:c.id, followUpId:f.id,
        title:'Overdue follow-up', message: c.company+' — "'+f.title+'"', generatedAt:f.dueAt});
    }
  });
  customers.forEach(function(c){
    if(c.status==='inactive' || c.status==='lost') return;
    var lastAct = custActivities(c.id)[0];
    var lastDate = lastAct ? lastAct.occurredAt : c.createdAt;
    var idleDays = Math.round((now-lastDate)/(1000*60*60*24));
    if(idleDays>=30){
      list.push({id:'stale-'+c.id, kind:'stale', customerId:c.id, followUpId:null,
        title:'No activity in '+idleDays+' days', message: c.company+' has gone quiet — still "'+statusOf(c.status).name+'"', generatedAt:lastDate});
    }
  });
  list = list.filter(function(a){ return !resolvedAlerts[a.id]; });
  return list.filter(function(a){
    if(role()==='admin') return true;

  var today = mine.filter(function(f){return f.status!=='done' && f.dueAt>=startOfToday() && f.dueAt<startOfToday(1) && f.dueAt>=now || (f.status!=='done' && f.dueAt>=startOfToday() && f.dueAt<startOfToday(1));});
  var upcoming = mine.filter(function(f){return f.status!=='done' && f.dueAt>=startOfToday(1);});
  var completed = mine.filter(function(f){return f.status==='done';});
  var tabs = [
    {id:'today', label:'Due today', count:today.length, list:today},
    {id:'upcoming', label:'Upcoming', count:upcoming.length, list:upcoming},
    {id:'overdue', label:'Overdue', count:overdue.length, list:overdue},
    {id:'completed', label:'Completed', count:completed.length, list:completed}

  var active = tabs.find(function(t){return t.id===state.fuTab;}) || tabs[0];
  var completedThisWeek = followUps.filter(function(f){ return f.status==='done' && f.completedAt && (now-f.completedAt)<7*24*3600*1000 && all.indexOf(f)>-1; });
  var totalScoped = mine.length;
  var doneScoped = mine.filter(function(f){return f.status==='done';}).length;
  var onTimePct = totalScoped? Math.round(doneScoped/totalScoped*100) : 0;

        '<div class="flex items-baseline gap-2"><h1 class="text-[24px] font-semibold tracking-tight">Follow-up Tasks</h1><span class="text-[12.5px] text-on-surface-variant font-medium">'+ROLE_LABEL[role()]+' pipeline</span></div></div>'+
        '<button id="btnCreateTask" class="h-9 px-3.5 bg-primary text-on-primary rounded-xl text-[12.5px] font-semibold flex items-center gap-1.5 hover:bg-primary-container transition shrink-0">'+ic('add_task','text-[18px]')+'<span>Create task</span></button>'+
      '</div>'+
      '<div class="flex items-center gap-1.5 overflow-x-auto pb-0.5" id="fuTabs">'+
        tabs.map(function(t){

            '<span>'+t.label+'</span><span class="px-1.5 py-0.5 rounded-full text-[10.5px] '+(isActive?'bg-primary/10 text-primary':'bg-surface-container text-on-surface-variant')+'">'+t.count+'</span></button>';

    '</div>'+

      '<div class="inline-flex p-1 bg-surface-container-low rounded-xl w-fit">'+
        '<button data-fu-scope="mine" class="px-3 py-1.5 rounded-lg text-[12px] font-semibold transition '+(state.fuScope==='mine'?'bg-surface-container-lowest shadow-xs':'text-on-surface-variant')+'">Assigned to me</button>'+
        '<button data-fu-scope="team" class="px-3 py-1.5 rounded-lg text-[12px] font-semibold transition '+(state.fuScope==='team'?'bg-surface-container-lowest shadow-xs':'text-on-surface-variant')+'">'+(role()==='staff'?'Team view':'All in scope')+'</button>'+
      '</div>'+
      '<div class="relative w-full lg:w-72"><span class="material-symbols-outlined text-outline absolute left-3 top-2 text-[17px]">search</span>'+
        '<input id="fuSearch" class="w-full h-8 pl-9 pr-3 rounded-lg bg-surface-container-low text-[12px] focus:outline-none focus:ring-2 focus:ring-primary-container" placeholder="Filter tasks, accounts..."></div>'+
    '</div>'+

      '<div class="xl:col-span-8 flex flex-col gap-3" id="fuCards"></div>'+

          '<div class="flex items-center justify-between mb-2"><span class="text-[10.5px] font-semibold text-on-surface-variant uppercase tracking-wider">Completion rate</span>'+
          '<span class="text-[10.5px] font-semibold bg-tertiary-fixed text-tertiary px-2 py-0.5 rounded-full">Live</span></div>'+
          '<div class="text-[26px] font-semibold tnum mb-2">'+onTimePct+'%</div>'+
          '<div class="w-full h-2 bg-surface-container-low rounded-full overflow-hidden mb-3"><div class="h-full bg-primary rounded-full" style="width:'+onTimePct+'%"></div></div>'+
          '<div class="grid grid-cols-3 gap-2 text-center">'+
            statMini('Total', totalScoped) + statMini('Done', doneScoped) + statMini('Open', totalScoped-doneScoped) +
          '</div></div>'+
        '<div class="bg-surface-container-lowest rounded-2xl shadow-xs p-4">'+
          '<div class="flex items-center gap-1.5 mb-3">'+ic('notifications_active','text-primary text-[18px]')+'<h3 class="text-[13.5px] font-semibold">Upcoming reminders</h3></div>'+
          '<div class="flex flex-col divide-y divide-outline-variant/30">'+

              '<div class="min-w-0"><div class="text-[12px] font-semibold truncate">'+esc(c?c.company:'')+'</div>'+
              '<div class="text-[11px] text-on-surface-variant truncate">'+esc(f.title)+'</div></div>'+
              '<span class="ml-auto text-[11px] text-outline whitespace-nowrap">'+dueLabel(f.dueAt,false)+'</span></div>';
          }).join('') : '<div class="text-[12px] text-on-surface-variant py-1">Nothing scheduled.</div>')+
          '</div></div>'+
      '</div>'+
    '</div>';

  wireCommon(el);
  el.querySelectorAll('[data-fu-tab]').forEach(function(b){ b.addEventListener('click', function(){ state.fuTab=b.dataset.fuTab; renderFollowUps(); }); });
  el.querySelectorAll('[data-fu-scope]').forEach(function(b){ b.addEventListener('click', function(){ state.fuScope=b.dataset.fuScope; renderFollowUps(); }); });
  document.getElementById('btnCreateTask').addEventListener('click', function(){ openLogModal(visibleCustomers()[0] ? visibleCustomers()[0].id : null, {mode:'task'}); });
  document.getElementById('fuSearch').addEventListener('input', function(e){ renderFuCards(active.list, e.target.value); });
  renderFuCards(active.list, '');
}
function statMini(label, value){
  return '<div class="bg-surface-container-low rounded-lg py-2"><div class="text-[15px] font-semibold tnum">'+value+'</div><div class="text-[10px] text-on-surface-variant">'+label+'</div></div>';
}
function renderFuCards(list, q){
  q = (q||'').trim().toLowerCase();
  var wrap = document.getElementById('fuCards');
  var filtered = list.filter(function(f){
    if(!q) return true;
    var c = customers.find(function(x){return x.id===f.customerId;});
    return (f.title+' '+(c?c.company:'')).toLowerCase().indexOf(q)>-1;
  }).sort(function(a,b){return a.dueAt-b.dueAt;});
  if(!filtered.length){ wrap.innerHTML = emptyState('No tasks in this view.', 'task_alt'); return; }
  wrap.innerHTML = filtered.map(fuCardHtml).join('');
  wrap.querySelectorAll('[data-complete-fu]').forEach(function(b){ b.addEventListener('click', function(){ toggleFollowUp(b.dataset.completeFu); }); });
  wrap.querySelectorAll('[data-log-outcome]').forEach(function(b){ b.addEventListener('click', function(){ openLogModal(b.dataset.logOutcome, {followUpId:b.dataset.fuId}); }); });
  wrap.querySelectorAll('[data-reschedule]').forEach(function(b){ b.addEventListener('click', function(){ openRescheduleModal(b.dataset.reschedule); }); });
  wrap.querySelectorAll('[data-open-cust]').forEach(function(t){ t.addEventListener('click', function(){ openDrawer(t.dataset.openCust); }); });
}
function fuCardHtml(f){
  var c = customers.find(function(x){return x.id===f.customerId;});
  var overdue = f.status!=='done' && f.dueAt<now;
  var linkedAct = f.activityId ? activities.find(function(a){return a.id===f.activityId;}) : null;
  var lastAct = linkedAct || custActivities(f.customerId)[0];
  var requestedNote = (f.createdBy && f.createdBy!==f.assignedTo) ? '<span class="text-outline"> · requested by '+esc(userOf(f.createdBy).name)+'</span>' : '';
  var badge = f.status==='done' ? '<span class="px-2.5 py-1 rounded-md bg-tertiary-fixed text-tertiary text-[11px] font-semibold flex items-center gap-1">'+ic('check_circle','text-[14px]')+'<span>Completed</span></span>'
    : overdue ? '<span class="px-2.5 py-1 rounded-md bg-error-container text-on-error-container text-[11px] font-semibold flex items-center gap-1">'+ic('schedule','text-[14px]')+'<span>'+dueLabel(f.dueAt,false)+'</span></span>'
    : '<span class="px-2.5 py-1 rounded-md bg-secondary-container text-on-secondary-fixed text-[11px] font-semibold flex items-center gap-1">'+ic('alarm','text-[14px]')+'<span>'+dueLabel(f.dueAt,false)+'</span></span>';
  return '<div class="bg-surface-container-lowest rounded-2xl shadow-xs p-4 flex flex-col gap-3">'+
    '<div class="flex flex-wrap items-center justify-between gap-2">'+
      '<div class="flex items-center gap-2 flex-wrap">'+badge+priorityPill(f.priority)+'<span class="text-outline text-[11px]">·</span><span class="text-[11px] text-outline tracking-wide">'+c.code+'</span></div>'+
      '<div class="flex items-center gap-1.5 text-[11.5px] text-on-surface-variant">'+avatarChip(f.assignedTo,22)+'<span class="font-medium text-on-surface">'+esc(userOf(f.assignedTo).name)+'</span>'+requestedNote+'</div>'+
    '</div>'+
    '<div><div class="flex items-baseline gap-2 flex-wrap"><span class="font-semibold text-[14.5px] hover:text-primary cursor-pointer" data-open-cust="'+c.id+'">'+esc(c.company)+'</span>'+
      '<span class="text-[12px] text-outline">'+esc(c.contact)+'</span></div>'+
      '<p class="text-[12.5px] text-on-surface-variant leading-relaxed mt-0.5">'+esc(f.title)+'</p>'+
      (f.description? '<p class="text-[12px] text-on-surface-variant mt-0.5">'+esc(f.description)+'</p>':'')+'</div>'+
    '<div class="bg-surface-container-low rounded-xl p-2.5 flex flex-wrap items-center justify-between gap-2">'+
      (lastAct ? '<div class="flex items-center gap-1.5 text-[12px] text-on-surface-variant">'+
        '<span class="w-6 h-6 rounded bg-surface-container-lowest flex items-center justify-center shadow-xs">'+ic(CHAN[lastAct.channel].icon,'text-[15px] '+CHAN[lastAct.channel].color)+'</span>'+
        '<span>'+(linkedAct? 'Created from: "'+esc(linkedAct.subject)+'"' : 'Last touch via '+lastAct.channel+' · '+relTime(lastAct.occurredAt))+'</span></div>' : '<span class="text-[12px] text-outline">No prior activity</span>')+
      '<div class="flex items-center gap-1.5 ml-auto">'+
        (f.status==='done' ? '<span class="text-[12px] text-tertiary font-semibold px-2">Done '+relTime(f.completedAt)+'</span>' :
        '<button class="px-2.5 py-1 rounded-lg text-on-surface-variant hover:bg-surface-container-lowest text-[12px] font-semibold transition" data-reschedule="'+f.id+'">Reschedule</button>'+
        '<button class="px-2.5 py-1 rounded-lg text-primary hover:bg-surface-container-lowest text-[12px] font-semibold transition" data-log-outcome="'+c.id+'" data-fu-id="'+f.id+'">Log outcome</button>'+
        '<button class="px-3 py-1 bg-primary text-on-primary rounded-lg text-[12px] font-semibold flex items-center gap-1 hover:bg-primary-container transition" data-complete-fu="'+f.id+'">'+ic('check_circle','text-[15px]')+'<span>Complete</span></button>')+
      '</div></div></div>';
}
function toggleFollowUp(id){
  var f = followUps.find(function(x){return x.id===id;});
  if(!f) return;
  f.status = f.status==='done' ? 'pending' : 'done';
  f.completedAt = f.status==='done' ? new Date() : null;
  showToast(f.status==='done' ? 'Follow-up marked complete' : 'Follow-up reopened');
  renderAll(true);
}

function renderFullFeed(all, q){
  q=(q||'').trim().toLowerCase();
  var filtered = all.filter(function(a){
    if(state.actChanFilter && state.actChanFilter!=='all' && a.channel!==state.actChanFilter) return false;
    if(!q) return true;
    var c = customers.find(function(x){return x.id===a.customerId;});
    return ((c?c.company:'')+' '+a.subject).toLowerCase().indexOf(q)>-1;
  });
  var wrap = document.getElementById('fullFeedWrap');
  if(!filtered.length){ wrap.innerHTML = emptyState('No matching activity.', 'history'); return; }
  wrap.innerHTML = '<div class="flex flex-col divide-y divide-outline-variant/30">' + filtered.map(function(a){

      '<div class="w-9 h-9 rounded-lg bg-surface-container-low flex items-center justify-center shrink-0">'+ic(ch.icon,'text-[17px] '+ch.color)+'</div>'+
      '<div class="min-w-0 flex-1">'+
        '<div class="flex items-baseline gap-2 flex-wrap">'+
          '<span class="font-semibold text-[13px] hover:text-primary cursor-pointer" data-open-cust="'+c.id+'">'+esc(c.company)+'</span>'+
          '<span class="text-[11px] text-outline">by '+userOf(a.recordedBy).name+'</span>'+
          '<span class="ml-auto text-[11.5px] text-outline tnum">'+fmtDateTime(a.occurredAt)+'</span>'+
        '</div>'+
        '<div class="text-[13px] font-medium mt-0.5">'+esc(a.subject)+'</div>'+
        (a.details? '<div class="text-[12.5px] text-on-surface-variant mt-0.5">'+esc(a.details)+'</div>' : '')+
        '<span class="inline-block mt-1.5 text-[11px] px-2 py-0.5 rounded-full bg-surface-container text-on-surface-variant font-medium">'+esc(a.outcome)+'</span>'+
      '</div></div>';
  }).join('') + '</div>';
  wrap.querySelectorAll('[data-open-cust]').forEach(function(t){ t.addEventListener('click', function(){ openDrawer(t.dataset.openCust); }); });
}

            '<td class="py-2.5 px-3 text-right tnum">'+accts.length+'</td><td class="py-2.5 px-3 text-right tnum">'+acts.length+'</td><td class="py-2.5 pl-3 text-right tnum">'+open.length+'</td></tr>';
        }).join('') +'</tbody>'+
      '</table></div></div>';
}

/* ============================= COMMON WIRING ============================= */
function wireCommon(root){
  root.querySelectorAll('[data-open-cust]').forEach(function(el){ if(!el.__wired){ el.__wired=true; el.addEventListener('click', function(){ openDrawer(el.dataset.openCust); }); } });
  root.querySelectorAll('[data-log-activity]').forEach(function(el){ if(!el.__wired){ el.__wired=true; el.addEventListener('click', function(e){ e.stopPropagation(); openLogModal(el.dataset.logActivity, {}); }); } });
  root.querySelectorAll('[data-resolve-alert]').forEach(function(el){ if(!el.__wired){ el.__wired=true; el.addEventListener('click', function(e){ e.stopPropagation(); resolveAlert(el.dataset.resolveAlert); }); } });
  root.querySelectorAll('[data-mark-fu-done]').forEach(function(el){ if(!el.__wired){ el.__wired=true; el.addEventListener('click', function(e){ e.stopPropagation(); toggleFollowUp(el.dataset.markFuDone); }); } });
  root.querySelectorAll('[data-goto]').forEach(function(el){ if(!el.__wired){ el.__wired=true; el.addEventListener('click', function(){ setView(el.dataset.goto); }); } });
  var qlSubmit = root.querySelector('#qlSubmit');
  if(qlSubmit && !qlSubmit.__wired){
    qlSubmit.__wired = true;
    var currentChan = CHANNELS[2] === 'Phone' ? 'LINE' : 'LINE';
    root.querySelectorAll('.ql-chan-btn').forEach(function(b){
      b.addEventListener('click', function(){
        root.querySelectorAll('.ql-chan-btn').forEach(function(x){ x.className='ql-chan-btn h-9 rounded-lg text-[10.5px] font-semibold flex items-center justify-center gap-1 px-1 transition bg-surface-container-low text-on-surface-variant hover:bg-surface-container'; });
        b.className='ql-chan-btn h-9 rounded-lg text-[10.5px] font-semibold flex items-center justify-center gap-1 px-1 transition bg-tertiary-fixed text-on-tertiary-fixed';
        b.dataset.selected='1';
      });
    });
    qlSubmit.addEventListener('click', function(){
      var custId = root.querySelector('#qlCustomer').value;
      var note = root.querySelector('#qlNote').value.trim();
      var chanBtn = root.querySelector('.ql-chan-btn[data-selected="1"]');
      var channel = chanBtn ? chanBtn.dataset.qlChan : 'LINE';
      if(!note){ showToast('Add a note first'); return; }
      var c = customers.find(function(x){return x.id===custId;});
      seq.a++;
      activities.push({id:'act'+seq.a, customerId:custId, channel:channel, subject:note.length>52?note.slice(0,52)+'...':note, details:note, outcome:'Completed', occurredAt:new Date(), recordedBy:state.currentUserId});
      c.updatedAt = new Date();
      root.querySelector('#qlNote').value='';
      showToast('Touchpoint recorded for '+c.company);
      renderAll(true);
    });
  }
}

        }).join('')+'</div>' : '<div class="text-[12px] text-on-surface-variant">No status changes recorded yet.</div>')+
      '</div>'+

        '<div class="flex gap-2">'+
          '<input id="fuTitle" class="flex-1 h-9 px-2.5 rounded-lg bg-surface-container-low text-[12.5px] focus:outline-none focus:ring-2 focus:ring-primary-container" placeholder="New task...">'+
          '<input id="fuDue" type="date" class="h-9 px-2 rounded-lg bg-surface-container-low text-[12.5px] focus:outline-none focus:ring-2 focus:ring-primary-container">'+
        '</div>'+
        '<button id="addFollowUp" class="w-full h-9 mt-2 bg-surface-container hover:bg-surface-container-high rounded-lg text-[12.5px] font-semibold flex items-center justify-center gap-1.5 transition">'+ic('add','text-[17px]')+'<span>Add follow-up</span></button>'+
      '</div>'+
    '</div>';

  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  drawer.querySelectorAll('.d-chan-btn').forEach(function(b){
    b.addEventListener('click', function(){
      drawer.querySelectorAll('.d-chan-btn').forEach(function(x){ x.className='d-chan-btn h-9 rounded-lg text-[11px] font-semibold flex items-center justify-center gap-1 transition bg-surface-container-low text-on-surface-variant hover:bg-surface-container'; });
      b.className='d-chan-btn h-9 rounded-lg text-[11px] font-semibold flex items-center justify-center gap-1 transition bg-tertiary-fixed text-on-tertiary-fixed';
      b.dataset.selected='1';
    });
  });
  document.getElementById('applyStatus').addEventListener('click', function(){
    var val = document.getElementById('statusSelect').value, reason = document.getElementById('statusReason').value.trim();
    if(val===c.status){ showToast('Status unchanged'); return; }
    shSeq++;
    statusHistory.push({id:'sh'+shSeq, customerId:custId, fromStatus:c.status, toStatus:val, changedBy:state.currentUserId, reason:reason, changedAt:new Date()});
    c.status = val; c.updatedAt = new Date();
    showToast('Status updated to '+statusOf(val).name+(reason?' - '+reason:''));
    openDrawer(custId); renderAll(true);
  });

    if(!subj){ showToast('Add a subject first'); return; }

    var occVal = document.getElementById('actOccurred').value;

  });

    seq.f++;

      assignedTo:c.ownerId, createdBy:state.currentUserId, priority:'medium', status:'pending', completedAt:null});

    openDrawer(custId); renderAll(true);
  });
  drawer.querySelectorAll('[data-toggle-fu]').forEach(function(b){ b.addEventListener('click', function(){ toggleFollowUp(b.dataset.toggleFu); openDrawer(custId); renderAll(true); }); });

  document.getElementById('scrim').classList.add('open');
  drawer.classList.add('open');
}
function closeDrawer(){
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  state.drawerCustId = null;
}
function kv(k,v){ return '<dt class="text-on-surface-variant">'+k+'</dt><dd class="font-semibold m-0 truncate">'+v+'</dd>'; }
function miniAct(a, isLast){
  var ch = CHAN[a.channel];
  return '<div class="flex gap-2.5">'+
    '<div class="flex flex-col items-center pt-0.5"><span class="w-2 h-2 rounded-full bg-primary shrink-0"></span>'+(isLast?'':'<span class="flex-1 w-px bg-outline-variant/50 mt-1"></span>')+'</div>'+

      (a.details? '<div class="text-[12px] text-on-surface-variant mt-0.5">'+esc(a.details)+'</div>':'')+
      '<span class="inline-block mt-1 text-[10.5px] px-2 py-0.5 rounded-full bg-surface-container text-on-surface-variant font-medium">'+esc(a.outcome)+'</span>'+
    '</div></div>';
}
function fuMini(f){
  var overdue = f.status!=='done' && f.dueAt<now;
  var linkedAct = f.activityId ? activities.find(function(a){return a.id===f.activityId;}) : null;
  var requestedNote = (f.createdBy && f.createdBy!==f.assignedTo) ? ' · requested by '+esc(userOf(f.createdBy).name) : '';
  return '<div class="py-2 flex items-start gap-2.5">'+
    '<input type="checkbox" data-toggle-fu="'+f.id+'" '+(f.status==='done'?'checked':'')+' class="mt-1 w-4 h-4 rounded accent-[#2563eb] cursor-pointer">'+
    '<div class="min-w-0 flex-1"><div class="text-[12.5px] font-medium '+(f.status==='done'?'line-through text-on-surface-variant':'')+'">'+esc(f.title)+'</div>'+
    '<div class="text-[11px] '+(overdue?'text-error font-semibold':'text-on-surface-variant')+'">'+dueLabel(f.dueAt,f.status==='done')+' · '+esc(userOf(f.assignedTo).name)+requestedNote+'</div>'+
    (linkedAct? '<div class="text-[10.5px] text-outline mt-0.5">From: "'+esc(linkedAct.subject)+'"</div>':'')+
    '</div></div>';
}

        '<input id="mFuDue" type="date" class="w-full h-9 px-2.5 rounded-lg bg-surface-container-low text-[12.5px] focus:outline-none focus:ring-2 focus:ring-primary-container" hidden>'
      )+
    '</div>'+
    '<div class="px-5 py-3.5 border-t border-outline-variant/40 flex justify-end gap-2 shrink-0">'+
      '<button id="mCancel" class="h-9 px-3.5 rounded-lg bg-surface-container hover:bg-surface-container-high text-[12.5px] font-semibold transition">Cancel</button>'+
      '<button id="mSave" class="h-9 px-3.5 rounded-lg bg-primary text-on-primary hover:bg-primary-container text-[12.5px] font-semibold flex items-center gap-1.5 transition">'+ic(opts.mode==='task'?'add_task':'send','text-[16px]')+'<span>'+(opts.mode==='task'?'Create task':'Save activity')+'</span></button>'+
    '</div>';
  openModalShell(html);
  var box = document.getElementById('modalBox');
  box.querySelector('#mClose').addEventListener('click', closeModal);
  box.querySelector('#mCancel').addEventListener('click', closeModal);
  box.querySelectorAll('.m-chan-btn').forEach(function(b){
    b.addEventListener('click', function(){
      box.querySelectorAll('.m-chan-btn').forEach(function(x){ x.className='m-chan-btn h-9 rounded-lg text-[10.5px] font-semibold flex items-center justify-center gap-1 px-1 transition bg-surface-container-low text-on-surface-variant hover:bg-surface-container'; });
      b.className='m-chan-btn h-9 rounded-lg text-[10.5px] font-semibold flex items-center justify-center gap-1 px-1 transition bg-tertiary-fixed text-on-tertiary-fixed';
      b.dataset.selected='1';
    });
  });
  var mAlsoFu = box.querySelector('#mAlsoFu');
  if(mAlsoFu) mAlsoFu.addEventListener('change', function(){ box.querySelector('#mFuDue').hidden = !this.checked; });
  var mAssignee = box.querySelector('#mAssignee');
  if(mAssignee){
    var startCust = customers.find(function(x){return x.id===custId;});
    if(startCust) mAssignee.value = startCust.ownerId;
  }
  box.querySelector('#mSave').addEventListener('click', function(){
    var cid = box.querySelector('#mCustomer').value;
    var c = customers.find(function(x){return x.id===cid;});
    if(opts.mode==='task'){
      var title = box.querySelector('#mTitle').value.trim(), due = box.querySelector('#mDue').value;
      if(!title||!due){ showToast('Add a task and due date'); return; }
      seq.f++;
      followUps.push({id:'fu'+seq.f, customerId:cid, title:title, description:box.querySelector('#mTaskDesc').value.trim()||null, activityId:null,
        dueAt:new Date(due+'T09:00:00'), assignedTo:box.querySelector('#mAssignee').value, createdBy:state.currentUserId,
        priority:box.querySelector('#mPriority').value, status:'pending', completedAt:null});
      showToast('Task created for '+c.company);
    } else {
      var subj = box.querySelector('#mSubject').value.trim();
      if(!subj){ showToast('Add a subject first'); return; }
      var chanBtn = box.querySelector('.m-chan-btn[data-selected="1"]');
      var occVal = box.querySelector('#mOccurred').value;
      seq.a++;
      var newActId = 'act'+seq.a;
      activities.push({id:newActId, customerId:cid, channel: chanBtn? chanBtn.dataset.mChan:'LINE', subject:subj,
        details:box.querySelector('#mDetails').value.trim(), outcome:box.querySelector('#mOutcome').value, occurredAt: occVal? new Date(occVal): new Date(), recordedBy:state.currentUserId});
      c.updatedAt = new Date();
      if(opts.followUpId){ var f=followUps.find(function(x){return x.id===opts.followUpId;}); if(f){ f.status='done'; f.completedAt=new Date(); } }
      var alsoFu = box.querySelector('#mAlsoFu').checked, fuDueVal = box.querySelector('#mFuDue').value;
      if(alsoFu && fuDueVal){
        seq.f++;
        followUps.push({id:'fu'+seq.f, customerId:cid, title:'Follow up: '+subj, description:null, activityId:newActId,
          dueAt:new Date(fuDueVal+'T09:00:00'), assignedTo:c.ownerId, createdBy:state.currentUserId, priority:'medium', status:'pending', completedAt:null});
        showToast('Activity logged and follow-up scheduled for '+c.company);
      } else {
        showToast('Activity logged for '+c.company);
      }
    }
    closeModal(); renderAll(true);
  });
}
function openRescheduleModal(fuId){

  if(!f) return;
  var c = customers.find(function(x){return x.id===f.customerId;});
  var iso = f.dueAt.toISOString().slice(0,10);
  var html = '<div class="px-5 py-4 border-b border-outline-variant/40 flex items-center justify-between">'+
      '<h3 class="text-[15px] font-semibold">Reschedule task</h3><button id="mClose" class="w-8 h-8 rounded-lg hover:bg-surface-container flex items-center justify-center">'+ic('close','text-[18px]')+'</button></div>'+
    '<div class="px-5 py-4 flex flex-col gap-3">'+
      '<div class="text-[12.5px] text-on-surface-variant"><b class="text-on-surface">'+esc(c.company)+'</b> — '+esc(f.title)+'</div>'+
      '<div class="flex flex-col gap-1"><label class="text-[10.5px] font-semibold text-on-surface-variant uppercase tracking-wider">New due date</label>'+
      '<input id="rDue" type="date" value="'+iso+'" class="w-full h-9 px-2.5 rounded-lg bg-surface-container-low text-[12.5px] focus:outline-none focus:ring-2 focus:ring-primary-container"></div>'+
    '</div>'+
    '<div class="px-5 py-3.5 border-t border-outline-variant/40 flex justify-end gap-2">'+
      '<button id="mCancel" class="h-9 px-3.5 rounded-lg bg-surface-container hover:bg-surface-container-high text-[12.5px] font-semibold">Cancel</button>'+
      '<button id="mSave" class="h-9 px-3.5 rounded-lg bg-primary text-on-primary hover:bg-primary-container text-[12.5px] font-semibold">Save date</button>'+
    '</div>';
  openModalShell(html);
  var box = document.getElementById('modalBox');
  box.querySelector('#mClose').addEventListener('click', closeModal);
  box.querySelector('#mCancel').addEventListener('click', closeModal);
  box.querySelector('#mSave').addEventListener('click', function(){
    var v = box.querySelector('#rDue').value;
    if(!v){ showToast('Pick a date'); return; }
    f.dueAt = new Date(v+'T09:00:00');
    showToast('Rescheduled to '+fmtDate(f.dueAt));
    closeModal(); renderAll(true);
  });
}
function openNewCustomerModal(){
  var html = '<div class="px-5 py-4 border-b border-outline-variant/40 flex items-center justify-between">'+
      '<h3 class="text-[15px] font-semibold">New customer</h3><button id="mClose" class="w-8 h-8 rounded-lg hover:bg-surface-container flex items-center justify-center">'+ic('close','text-[18px]')+'</button></div>'+
    '<div class="px-5 py-4 flex flex-col gap-3 overflow-y-auto">'+
      field('ncCompany','Company name','e.g. Harbor & Lane Co.') +
      field('ncContact','Contact name','e.g. Alex Rivera') +
      '<div class="grid grid-cols-2 gap-3">'+ field('ncEmail','Email','name@company.com') + field('ncPhone','Phone','+66 8x xxx xxxx') +'</div>'+
      '<div class="grid grid-cols-2 gap-3">'+
        '<div class="flex flex-col gap-1"><label class="text-[10.5px] font-semibold text-on-surface-variant uppercase tracking-wider">Status</label><select id="ncStatus" class="w-full h-9 px-2 rounded-lg bg-surface-container-low text-[12.5px]">'+STATUSES.map(function(s){return '<option value="'+s.id+'">'+s.name+'</option>';}).join('')+'</select></div>'+
        '<div class="flex flex-col gap-1"><label class="text-[10.5px] font-semibold text-on-surface-variant uppercase tracking-wider">Owner</label><select id="ncOwner" class="w-full h-9 px-2 rounded-lg bg-surface-container-low text-[12.5px]">'+USERS.filter(function(u){return u.role!=='admin';}).map(function(u){return '<option value="'+u.id+'">'+u.name+'</option>';}).join('')+'</select></div>'+
      '</div>'+
    '</div>'+
    '<div class="px-5 py-3.5 border-t border-outline-variant/40 flex justify-end gap-2">'+
      '<button id="mCancel" class="h-9 px-3.5 rounded-lg bg-surface-container hover:bg-surface-container-high text-[12.5px] font-semibold">Cancel</button>'+
      '<button id="mSave" class="h-9 px-3.5 rounded-lg bg-primary text-on-primary hover:bg-primary-container text-[12.5px] font-semibold flex items-center gap-1.5">'+ic('add','text-[17px]')+'<span>Add customer</span></button>'+
    '</div>';
  openModalShell(html);
  var box = document.getElementById('modalBox');
  box.querySelector('#mClose').addEventListener('click', closeModal);
  box.querySelector('#mCancel').addEventListener('click', closeModal);
  box.querySelector('#mSave').addEventListener('click', function(){
    var company = box.querySelector('#ncCompany').value.trim(), contact = box.querySelector('#ncContact').value.trim();
    if(!company || !contact){ showToast('Company and contact are required'); return; }
    var c = mkCustomer(company, contact, box.querySelector('#ncEmail').value.trim(), box.querySelector('#ncPhone').value.trim(),
      box.querySelector('#ncStatus').value, box.querySelector('#ncOwner').value, 0);
    customers.unshift(c);
    closeModal(); showToast('Customer added'); renderAll();
  });
}
function field(id,label,ph){
  return '<div class="flex flex-col gap-1"><label class="text-[10.5px] font-semibold text-on-surface-variant uppercase tracking-wider">'+label+'</label>'+
    '<input id="'+id+'" class="w-full h-9 px-2.5 rounded-lg bg-surface-container-low text-[12.5px] focus:outline-none focus:ring-2 focus:ring-primary-container" placeholder="'+ph+'"></div>';
}

/* ============================= BELL ============================= */
function renderBell(){
  var alertsNow = computeAlerts();
  document.getElementById('bellDot').hidden = alertsNow.length===0;
  document.getElementById('bellCount').textContent = alertsNow.length;
  var list = document.getElementById('bellList');
  if(!alertsNow.length){ list.innerHTML = '<div class="px-4 py-6 text-center text-[12px] text-on-surface-variant">You\'re all caught up.</div>'; return; }
  list.innerHTML = alertsNow.slice(0,8).map(function(a){
    var c = customers.find(function(x){return x.id===a.customerId;});
    var tone = a.kind==='overdue' ? 'text-error bg-error-container' : 'text-amber bg-amber-container';
    return '<div class="px-4 py-3 flex items-start gap-2.5 hover:bg-surface-container-low">'+
      '<div class="w-7 h-7 rounded-lg '+tone+' flex items-center justify-center shrink-0">'+ic(a.kind==='overdue'?'schedule':'notifications_active','text-[15px]')+'</div>'+
      '<div class="min-w-0 flex-1 cursor-pointer" data-bell-open="'+c.id+'"><div class="text-[12px] font-semibold truncate">'+esc(c.company)+'</div>'+
      '<div class="text-[11.5px] text-on-surface-variant leading-snug">'+esc(a.message)+'</div></div>'+
      '<button class="text-outline hover:text-on-surface shrink-0" data-bell-resolve="'+a.id+'">'+ic('close','text-[16px]')+'</button>'+
    '</div>';
  }).join('');
  list.querySelectorAll('[data-bell-open]').forEach(function(el){ el.addEventListener('click', function(){ closeAllPops(); openDrawer(el.dataset.bellOpen); }); });
  list.querySelectorAll('[data-bell-resolve]').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); resolveAlert(el.dataset.bellResolve); }); });
}

/* ============================= GLOBAL RENDER ============================= */
function renderAll(keepDrawer){
  var fns = { dashboard:renderDashboard, customers:renderCustomers, followups:renderFollowUps, activity:renderActivityLog, reports:renderReports };
  fns[state.view]();
  renderBell();
  if(!keepDrawer && state.drawerCustId && !visibleCustomers().some(function(c){return c.id===state.drawerCustId;})) closeDrawer();
}

/* ============================= INIT / EVENTS ============================= */
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.getElementById('modalScrim').addEventListener('click', function(e){ if(e.target.id==='modalScrim') closeModal(); });
document.getElementById('btnNewActivity').addEventListener('click', function(){ var v=visibleCustomers(); openLogModal(v.length?v[0].id:null, {}); });
document.getElementById('btnBell').addEventListener('click', function(e){ e.stopPropagation(); document.getElementById('avatarPop').classList.remove('open'); document.getElementById('bellPop').classList.toggle('open'); });
document.getElementById('btnAvatar').addEventListener('click', function(e){ e.stopPropagation(); document.getElementById('bellPop').classList.remove('open'); renderAvatarPop(); document.getElementById('avatarPop').classList.toggle('open'); });
document.addEventListener('click', function(e){ if(!e.target.closest('#btnBell') && !e.target.closest('#bellPop')) document.getElementById('bellPop').classList.remove('open'); if(!e.target.closest('#btnAvatar') && !e.target.closest('#avatarPop')) document.getElementById('avatarPop').classList.remove('open'); });
document.getElementById('mobileNavBtn') && document.getElementById('mobileNavBtn').addEventListener('click', function(){ document.querySelector('.app-sidebar').classList.toggle('open'); });
document.getElementById('searchInput').addEventListener('input', function(e){
  state.search = e.target.value;
  if(e.target.value.trim()){ if(state.view!=='customers') setView('customers'); else renderCustomerRows(); }
});
document.getElementById('roleSelect').addEventListener('change', function(e){
  state.currentUserId = e.target.value;
  renderRoleSelect(); closeDrawer(); renderAll();
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeDrawer(); closeModal(); closeAllPops(); } });

renderNav();
renderRoleSelect();
setView('dashboard');
})();
</script>
