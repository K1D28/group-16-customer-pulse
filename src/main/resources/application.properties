spring.application.name=customer-pulse
server.port=${PORT:8080}

# ---------- Database: embedded H2 (default) ----------
# Data is kept in ./data/ between restarts. Use the "mysql" profile for Cloud SQL.
spring.datasource.url=jdbc:h2:file:./data/customerpulse;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Session (NFR-05: log out after 30 minutes idle) ----------
server.servlet.session.timeout=30m

# ---------- App ----------
# Sample staff (Nadia, Marcus), customers, activities and follow-ups on an empty database.
# Set to false for a clean start with only the first Manager.
app.seed-demo-data=${APP_SEED_DEMO_DATA:true}
# The first Manager account, created on an empty database (FR-10)
app.first-manager.name=${APP_FIRST_MANAGER_NAME:Priya Raman}
app.first-manager.email=${APP_FIRST_MANAGER_EMAIL:priya@example.com}
app.first-manager.password=${APP_FIRST_MANAGER_PASSWORD:password123}

# ---------- Time zone: Thailand (UTC+7) ----------
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok
spring.thymeleaf.cache=false
