spring.application.name=customer-pulse
server.port=${PORT:8080}

# ---------- Database: embedded H2 (default) ----------
# Data is kept in ./data/ between restarts. Use the "mysql" profile for Cloud SQL.
spring.datasource.url=jdbc:h2:file:./data/customerpulse;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Session (NFR-06: log out after 30 minutes idle) ----------
server.servlet.session.timeout=30m

# ---------- App ----------
# Sample customers, staff and cases for Team A (off = clean start with 3 teams and their managers only)
app.seed-demo-data=false
spring.thymeleaf.cache=false
