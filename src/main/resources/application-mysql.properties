# Activate with: SPRING_PROFILES_ACTIVE=mysql
#
# Local MySQL:
#   DB_URL=jdbc:mysql://localhost:3306/customer_pulse?createDatabaseIfNotExist=true
#
# GCP Cloud SQL (App Engine / Cloud Run), via the Cloud SQL socket factory:
#   DB_URL=jdbc:mysql:///customer_pulse?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.mysql.SocketFactory
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/customer_pulse?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.h2.console.enabled=false
spring.thymeleaf.cache=true
