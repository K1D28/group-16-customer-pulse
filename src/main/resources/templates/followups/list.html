<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Follow-ups')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Follow-ups</h1>
                    <p>Pending follow-ups past their due date are marked <strong>Overdue</strong> automatically every day.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/followups/new}"><span class="ms">add</span> Add follow-up</a>
            </div>

            <div class="seg mb-3" role="tablist">
                <a th:href="@{/followups(tab='open')}" th:classappend="${tab == 'open'} ? 'active'" th:text="'Open (' + ${openCount} + ')'">Open</a>
                <a th:href="@{/followups(tab='overdue')}" th:classappend="${tab == 'overdue'} ? 'active'" th:text="'Overdue (' + ${overdueCount} + ')'">Overdue</a>
                <a th:href="@{/followups(tab='completed')}" th:classappend="${tab == 'completed'} ? 'active'">Completed</a>
                <a th:href="@{/followups(tab='all')}" th:classappend="${tab == 'all'} ? 'active'">All</a>
            </div>

            <section class="cp-card">
                <div th:if="${items.isEmpty()}" class="empty"><span class="ms">task_alt</span>Nothing here.</div>
                <div class="table-responsive" th:unless="${items.isEmpty()}">
                    <table class="table cp-table">
                        <thead>
                        <tr><th>Due</th><th>Task</th><th>Customer</th><th>Assigned to</th><th>Status</th><th class="text-end">Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="f : ${items}">
                            <td class="text-nowrap">
                                <div class="fw-semibold" th:text="${@fmt.date(f.dueDate)}"></div>
                                <div class="small" th:if="${f.open}" th:style="${f.status.name() == 'OVERDUE'} ? 'color:var(--cp-red)'" th:text="${@fmt.due(f.dueDate)}"></div>
                            </td>
                            <td style="min-width:220px" th:text="${f.notes ?: 'Follow-up'}"></td>
                            <td><a class="row-link" th:href="@{/customers/{id}(id=${f.customer.id})}" th:text="${f.customer.companyName}"></a></td>
                            <td class="text-nowrap">
                                <span class="avatar avatar-sm avatar-soft me-1" th:text="${f.assignedUser.initials}"></span>
                                <span th:text="${f.assignedUser.fullName}"></span>
                            </td>
                            <td><span class="pill" th:classappend="${f.status.css}" th:text="${f.status.label}"></span></td>
                            <td class="text-end text-nowrap">
                                <form th:if="${f.open}" class="d-inline" th:action="@{/followups/{id}/complete(id=${f.id})}" method="post">
                                    <input type="hidden" name="back" th:value="'/followups?tab=' + ${tab}">
                                    <button class="btn btn-sm btn-soft" type="submit"><span class="ms">check</span> Complete</button>
                                </form>
                                <form th:unless="${f.open}" class="d-inline" th:action="@{/followups/{id}/reopen(id=${f.id})}" method="post">
                                    <input type="hidden" name="back" th:value="'/followups?tab=' + ${tab}">
                                    <button class="btn btn-sm btn-light" type="submit"><span class="ms">undo</span> Reopen</button>
                                </form>
                                <a class="btn btn-sm btn-light" th:href="@{/followups/{id}/edit(id=${f.id})}" aria-label="Edit"><span class="ms">edit</span></a>
                                <form class="d-inline" th:action="@{/followups/{id}/delete(id=${f.id})}" method="post" data-confirm="Delete this follow-up?">
                                    <input type="hidden" name="back" th:value="'/followups?tab=' + ${tab}">
                                    <button class="btn btn-sm btn-light" type="submit" aria-label="Delete"><span class="ms">delete</span></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
