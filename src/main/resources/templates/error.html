<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<div class="login-panel" style="min-height:100vh;background:var(--cp-bg)">
    <div class="cp-card cp-card-body text-center" style="max-width:440px">
        <span class="ms" style="font-size:44px;color:var(--cp-faint)"
              th:text="${status == 403} ? 'lock' : (${status == 404} ? 'search_off' : 'error')">error</span>
        <h1 class="h4 fw-semibold mt-2"
            th:text="${status == 403} ? 'You do not have access' : (${status == 404} ? 'Page not found' : 'Something went wrong')">Error</h1>
        <p class="text-muted"
           th:text="${status == 403} ? 'This page or customer is outside your access. Ask a Manager if you need it.' : (${status == 404} ? 'The record may have been deleted.' : 'Please try again. If it keeps happening, tell your Manager.')"></p>
        <a class="btn btn-primary" th:href="@{/dashboard}"><span class="ms">home</span> Back to dashboard</a>
    </div>
</div>
</body>
</html>
