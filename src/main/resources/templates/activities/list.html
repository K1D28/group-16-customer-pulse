<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Activity log')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Activity log</h1>
                    <p th:text="'Every interaction logged in ' + ${me.team.name} + '.'"></p>
                </div>
                <a class="btn btn-primary" th:href="@{/activities/new}"><span class="ms">add</span> Log activity</a>
            </div>

            <section class="cp-card">
                <form class="cp-card-body filter-bar border-bottom" th:action="@{/activities}" method="get">
                    <div class="flex-grow-1">
                        <label class="form-label" for="q">Search</label>
                        <input class="form-control" id="q" name="q" th:value="${q}" placeholder="Outcome or company">
                    </div>
                    <div>
                        <label class="form-label" for="type">Type</label>
                        <select class="form-select" id="type" name="type">
                            <option value="">All types</option>
                            <option th:each="t : ${activityTypes}" th:value="${t}" th:text="${t.label}" th:selected="${t == type}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label" for="channel">Channel</label>
                        <select class="form-select" id="channel" name="channel">
                            <option value="">All channels</option>
                            <option th:each="c : ${channels}" th:value="${c}" th:text="${c.label}" th:selected="${c == channel}"></option>
                        </select>
                    </div>
                    <button class="btn btn-primary" type="submit"><span class="ms">filter_list</span> Filter</button>
                    <a th:if="${q != null or type != null or channel != null}" class="btn btn-light" th:href="@{/activities}">Clear</a>
                </form>

                <div th:if="${page.totalElements == 0}" class="empty"><span class="ms">search_off</span>No results found</div>

                <div class="table-responsive" th:if="${page.totalElements > 0}">
                    <table class="table cp-table">
                        <thead>
                        <tr><th>When</th><th>Customer</th><th>Type</th><th>Channel</th><th>Outcome</th><th>Logged by</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="a : ${page.content}">
                            <td class="text-nowrap">
                                <div th:text="${@fmt.date(a.activityDate)}"></div>
                                <div class="text-faint small" th:text="${#temporals.format(a.activityDate, 'HH:mm')}"></div>
                            </td>
                            <td><a class="row-link" th:href="@{/customers/{id}(id=${a.customer.id})}" th:text="${a.customer.companyName}"></a></td>
                            <td class="text-nowrap"><span class="ms ms-sm text-faint" th:text="${a.activityType.icon}"></span> <span th:text="${a.activityType.label}"></span></td>
                            <td><span class="tl-chip" th:text="${a.channel.label}"></span></td>
                            <td style="min-width:260px" th:text="${a.outcome}"></td>
                            <td class="text-nowrap" th:text="${a.user.fullName}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="cp-card-body d-flex flex-wrap align-items-center justify-content-between gap-2 border-top" th:if="${page.totalPages > 1}">
                    <span class="text-muted" th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}"></span>
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/activities(q=${q},type=${type},channel=${channel},page=${page.number - 1})}">Previous</a>
                        </li>
                        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/activities(q=${q},type=${type},channel=${channel},page=${page.number + 1})}">Next</a>
                        </li>
                    </ul>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
