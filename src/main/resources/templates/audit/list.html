<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Audit log')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="app-content reporting-page">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Audit log</h1>
                    <p>Who created, changed or deleted what, and when. Entries cannot be edited or deleted.</p>
                </div>
            </div>

            <form class="cp-card cp-card-body filter-bar report-filters mb-4" th:action="@{/audit}" method="get">
                <div>
                    <label class="form-label" for="from">From</label>
                    <input class="form-control" type="date" id="from" name="from" th:value="${from}">
                </div>
                <div>
                    <label class="form-label" for="to">to</label>
                    <input class="form-control" type="date" id="to" name="to" th:value="${to}">
                </div>
                <div>
                    <label class="form-label" for="userId">User</label>
                    <select class="form-select" id="userId" name="userId">
                        <option value="">Everyone</option>
                        <option th:each="u : ${userOptions}" th:value="${u.id}" th:text="${u.fullName}" th:selected="${u.id == userId}"></option>
                    </select>
                </div>
                <div>
                    <label class="form-label" for="recordType">Record type</label>
                    <select class="form-select" id="recordType" name="recordType">
                        <option value="">All</option>
                        <option th:each="t : ${recordTypes}" th:value="${t}" th:text="${t.label}" th:selected="${t == recordType}"></option>
                    </select>
                </div>
                <div>
                    <label class="form-label" for="action">Action</label>
                    <select class="form-select" id="action" name="action">
                        <option value="">All</option>
                        <option th:each="a : ${actions}" th:value="${a}" th:text="${a.label}" th:selected="${a == action}"></option>
                    </select>
                </div>
                <div>
                    <label class="form-label" for="customerId">Customer</label>
                    <select class="form-select" id="customerId" name="customerId">
                        <option value="">All</option>
                        <option th:each="c : ${customerOptions}" th:value="${c.id}"
                                th:text="${c.companyName} + (${c.deleted} ? ' (deleted)' : '')" th:selected="${c.id == customerId}"></option>
                    </select>
                </div>
                <button class="btn btn-primary" type="submit"><span class="ms">filter_list</span> Apply</button>
                <a class="btn btn-light" th:href="@{/audit}">Reset</a>
            </form>

            <section class="cp-card">
                <div th:if="${page.totalElements == 0}" class="empty"><span class="ms">search_off</span>No results found</div>
                <div class="table-responsive" th:if="${page.totalElements > 0}">
                    <table class="table cp-table">
                        <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Record</th><th>Customer</th><th>Changes</th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${rows}" th:with="e=${r.entry}">
                            <td class="text-nowrap" th:text="${@fmt.dateTime(e.createdAt)}"></td>
                            <td class="text-nowrap" th:text="${e.user.fullName}"></td>
                            <td><span class="pill no-dot" th:classappend="${e.action.css}" th:text="${e.action.label}"></span></td>
                            <td class="text-nowrap" th:text="${e.recordType.label} + ' #' + ${e.recordId}"></td>
                            <td>
                                <span th:if="${e.customer == null}" class="text-faint">—</span>
                                <a th:if="${e.customer != null and !e.customer.deleted}" class="row-link" th:href="@{/customers/{id}(id=${e.customer.id})}" th:text="${e.customer.companyName}"></a>
                                <span th:if="${e.customer != null and e.customer.deleted}" th:text="${e.customer.companyName} + ' (deleted)'"></span>
                            </td>
                            <td style="min-width:260px">
                                <div th:each="c : ${r.changes}" class="small">
                                    <code th:text="${c.field}">field</code>:
                                    <th:block th:if="${c.update}">
                                        <span class="text-faint text-decoration-line-through" th:text="${c.oldValue} ?: '(empty)'">old</span>
                                        <span class="ms ms-sm text-faint">arrow_forward</span>
                                        <span th:text="${c.newValue} ?: '(empty)'">new</span>
                                    </th:block>
                                    <span th:unless="${c.update}" th:text="${c.value} ?: '(empty)'">value</span>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="cp-card-body border-top d-flex flex-wrap align-items-center justify-content-between gap-2"
                     th:if="${page.totalElements > 0}">
                    <span class="text-muted small"
                          th:text="'Showing ' + ${page.number * page.size + 1} + '–' + ${page.number * page.size + page.numberOfElements} + ' of ' + ${page.totalElements}"></span>
                    <nav th:if="${page.totalPages > 1}" aria-label="Pages">
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/audit(from=${from},to=${to},userId=${userId},recordType=${recordType},action=${action},customerId=${customerId},page=${page.number - 1})}">Previous</a>
                            </li>
                            <li class="page-item disabled"><span class="page-link" th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 3</span></li>
                            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/audit(from=${from},to=${to},userId=${userId},recordType=${recordType},action=${action},customerId=${customerId},page=${page.number + 1})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
