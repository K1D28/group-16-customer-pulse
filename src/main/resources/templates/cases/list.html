<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Cases')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Cases</h1>
                    <p th:text="${me.manager} ? 'Work you have handed to the team. A case closes when every assignee marks their part done.' : 'Cases you are assigned to. Log activity on them and mark your part done when finished.'"></p>
                </div>
                <a th:if="${me.manager}" class="btn btn-primary" th:href="@{/cases/new}"><span class="ms">add</span> New case</a>
            </div>

            <div class="seg mb-3" role="tablist">
                <a th:href="@{/cases(tab='active')}" th:classappend="${tab == 'active'} ? 'active'" th:text="'Active (' + ${activeCount} + ')'">Active</a>
                <a th:href="@{/cases(tab='closed')}" th:classappend="${tab == 'closed'} ? 'active'" th:text="'Closed (' + ${closedCount} + ')'">Closed</a>
                <a th:href="@{/cases(tab='all')}" th:classappend="${tab == 'all'} ? 'active'">All</a>
            </div>

            <section class="cp-card">
                <div th:if="${items.isEmpty()}" class="empty">
                    <span class="ms">work_off</span>
                    <span th:text="${tab == 'closed'} ? 'No closed cases yet.' : (${me.manager} ? 'No active cases. Create one to hand work to the team.' : 'You have no active cases.')"></span>
                </div>
                <div class="table-responsive" th:unless="${items.isEmpty()}">
                    <table class="table cp-table">
                        <thead>
                        <tr><th>Case</th><th>Customer</th><th>Priority</th><th>Assignees</th><th style="min-width:150px">Progress</th><th>Due</th><th>Status</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${items}" th:with="team=${assignees.get(c.id) ?: {}}, p=${@caseService.progress(team)}">
                            <td style="min-width:220px">
                                <a class="row-link" th:href="@{/cases/{id}(id=${c.id})}" th:text="${c.title}">Title</a>
                                <div class="text-faint small tnum" th:text="${c.code}">CASE-0001</div>
                            </td>
                            <td th:text="${c.customer.companyName}"></td>
                            <td><span class="pill no-dot" th:classappend="${c.priority.css}" th:text="${c.priority.label}"></span></td>
                            <td>
                                <div class="avatar-stack">
                                    <span th:each="a : ${team}" class="avatar avatar-sm" th:classappend="${a.done} ? 'avatar-done' : 'avatar-soft'"
                                          th:text="${a.user.initials}" th:title="${a.user.fullName} + (${a.done} ? ' (done)' : ' (working)')"></span>
                                </div>
                            </td>
                            <td>
                                <div class="case-progress" th:attr="aria-label=${p.done} + ' of ' + ${p.total} + ' done'">
                                    <span th:style="'width:' + ${p.percent} + '%'"></span>
                                </div>
                                <div class="text-faint small mt-1 tnum" th:text="${p.done} + ' of ' + ${p.total} + ' done'"></div>
                            </td>
                            <td class="text-nowrap">
                                <span th:if="${c.dueDate == null}" class="text-faint">—</span>
                                <th:block th:if="${c.dueDate != null}">
                                    <div th:text="${@fmt.date(c.dueDate)}"></div>
                                    <div class="small" th:if="${!c.closed}" th:style="${c.overdue} ? 'color:var(--cp-red)'" th:text="${@fmt.due(c.dueDate)}"></div>
                                </th:block>
                            </td>
                            <td><span class="pill" th:classappend="${c.status.css}" th:text="${c.status.label}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
