<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${serviceCase == null} ? 'New case' : 'Edit case')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="page-head">
                <div>
                    <a class="small fw-semibold text-decoration-none"
                       th:href="${serviceCase == null} ? @{/cases} : @{/cases/{id}(id=${serviceCase.id})}">
                        <span class="ms ms-sm">arrow_back</span> Back
                    </a>
                    <h1 class="mt-1" th:text="${serviceCase == null} ? 'New case' : 'Edit ' + ${serviceCase.code}">New case</h1>
                    <p>Assigned employees can log activity on this case. It closes when all of them mark their part done.</p>
                </div>
            </div>

            <form class="cp-card form-card" th:object="${form}" method="post" novalidate
                  th:action="${serviceCase == null} ? @{/cases} : @{/cases/{id}(id=${serviceCase.id})}">
                <div class="cp-card-body d-grid gap-3">
                    <div>
                        <label class="form-label" for="title">Title <span class="text-danger">*</span></label>
                        <input class="form-control" th:field="*{title}" th:errorclass="is-invalid" maxlength="150"
                               placeholder="e.g. Win back Northgate before year end">
                        <div class="invalid-feedback" th:errors="*{title}"></div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="customerId">Customer <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{customerId}" th:errorclass="is-invalid">
                                <option value="">Choose a customer…</option>
                                <option th:each="c : ${customerOptions}" th:value="${c.id}" th:text="${c.companyName}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{customerId}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="dueDate">Due date <span class="text-faint fw-normal">(optional)</span></label>
                            <input class="form-control" type="date" th:field="*{dueDate}">
                        </div>
                    </div>
                    <div>
                        <span class="form-label d-block">Priority <span class="text-danger">*</span></span>
                        <div class="choice-grid" style="grid-template-columns:repeat(3,1fr)">
                            <th:block th:each="p : ${priorities}">
                                <input type="radio" th:field="*{priority}" th:value="${p}">
                                <label th:for="${#ids.prev('priority')}"><span class="pill no-dot" th:classappend="${p.css}" th:text="${p.label}"></span></label>
                            </th:block>
                        </div>
                    </div>
                    <div>
                        <label class="form-label" for="description">What needs to be done</label>
                        <textarea class="form-control" th:field="*{description}" th:errorclass="is-invalid" rows="4" maxlength="2000"
                                  placeholder="Goal, context, and what each person should cover"></textarea>
                        <div class="invalid-feedback" th:errors="*{description}"></div>
                    </div>
                    <div>
                        <span class="form-label d-block">Assign employees <span class="text-danger">*</span></span>
                        <div class="assignee-grid" th:classappend="${#fields.hasErrors('assigneeIds')} ? 'is-invalid-group'">
                            <th:block th:each="u : ${userOptions}">
                                <input type="checkbox" th:field="*{assigneeIds}" th:value="${u.id}">
                                <label th:for="${#ids.prev('assigneeIds')}">
                                    <span class="avatar avatar-sm avatar-soft" th:text="${u.initials}"></span>
                                    <span>
                                        <span class="d-block fw-semibold" th:text="${u.fullName}"></span>
                                        <span class="text-faint small" th:text="${u.role.label}"></span>
                                    </span>
                                    <span class="ms check">check_circle</span>
                                </label>
                            </th:block>
                        </div>
                        <div class="text-danger small mt-1" th:errors="*{assigneeIds}"></div>
                        <div class="form-text" th:if="${serviceCase != null}">Removing someone deletes their part. Adding someone to a closed case reopens it.</div>
                    </div>
                </div>
                <div class="cp-card-body border-top d-flex gap-2 justify-content-end">
                    <a class="btn btn-light" th:href="${serviceCase == null} ? @{/cases} : @{/cases/{id}(id=${serviceCase.id})}">Cancel</a>
                    <button class="btn btn-primary" type="submit"><span class="ms">save</span>
                        <span th:text="${serviceCase == null} ? 'Create case' : 'Save case'">Save</span></button>
                </div>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
